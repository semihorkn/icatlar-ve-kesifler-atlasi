<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>iotfyedu — Teknoloji Atlası</title>
  <meta name="description" content="İnsanlığın dönüm noktası olan buluşlarını Türkçe ve etkileşimli biçimde keşfedin.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c1110'/%3E%3Cpath d='M18 33h28M32 19v28' stroke='%23b7f34a' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='33' r='15' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#111715;--muted:#6b746f;--line:#dfe5e1;--paper:#f8faf8;--panel:#fff;--acid:#b7f34a;--deep:#0c1110;--orange:#f2653f}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{color:inherit}img{display:block;max-width:100%}
    .topbar{height:78px;display:grid;grid-template-columns:280px 1fr auto;align-items:center;border-bottom:1px solid var(--line);background:rgba(248,250,248,.96);position:sticky;top:0;z-index:20}
    .brand{height:100%;display:flex;align-items:center;gap:12px;padding:0 26px;border-right:1px solid var(--line)}.mark{width:36px;height:36px;border-radius:9px;background:var(--deep);color:var(--acid);display:grid;place-items:center;font-weight:900;letter-spacing:-2px}.brand strong{font-size:19px;letter-spacing:-.4px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
    nav{display:flex;align-items:center;gap:30px;padding:0 34px}nav a{text-decoration:none;color:var(--muted);font-size:14px}nav a.active{color:var(--ink);font-weight:700}.search{display:flex;align-items:center;gap:8px;margin-right:20px;border-bottom:1px solid var(--line);padding:8px 0}.search span{font-size:20px}.search input{width:210px;border:0;outline:0;background:transparent;font-size:14px}
    .app{height:calc(100vh - 78px);min-height:620px;display:grid;grid-template-columns:280px minmax(380px,1fr) 390px;background:var(--panel)}
    .catalog{border-right:1px solid var(--line);overflow:auto;padding:18px 16px}.catalog-head{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 16px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#65706a}.count{font-size:12px;color:var(--muted)}.item{width:100%;height:82px;display:grid;grid-template-columns:68px 1fr auto;align-items:center;border:0;border-bottom:1px solid #edf0ee;background:transparent;text-align:left;padding:8px;border-radius:8px;cursor:pointer;transition:.2s}.item:hover{background:#f4f7f3}.item.active{background:#f0fbdc;box-shadow:inset 3px 0 var(--acid)}.thumb{width:60px;height:60px;object-fit:contain;filter:saturate(.75)}.item-title{font-weight:720;font-size:14px}.item-date{font-size:11px;color:var(--muted);margin-top:6px}.number{font-size:11px;color:#98a09b}.catalog-foot{padding:16px 8px;color:var(--muted);font-size:11px;line-height:1.5}
    .stage{position:relative;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 44%,#fff 0,#fff 34%,#f3f7f3 80%)}.stage-head{padding:34px 42px;display:flex;justify-content:space-between}.stage-date{font-size:14px;letter-spacing:.17em}.stage-place{font-size:12px;color:var(--muted);margin-top:10px}.stage-badge{background:var(--deep);color:#fff;height:max-content;padding:9px 12px;border-radius:999px;font-size:11px}.object-wrap{position:relative;display:grid;place-items:center;padding:0 50px}.halo{position:absolute;width:min(58vw,420px);aspect-ratio:1;border:1px solid #dfe8de;border-radius:50%;box-shadow:0 0 0 45px rgba(183,243,74,.06),0 0 0 90px rgba(183,243,74,.035)}.object{max-width:min(72%,480px);max-height:390px;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 28px 22px rgba(20,30,24,.16));transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .25s}.object:hover{transform:rotate(-2deg) scale(1.025)}.orbit{position:absolute;z-index:3;width:20px;height:20px;background:var(--acid);border:5px solid #fff;border-radius:50%;box-shadow:0 2px 10px #50603c55;top:38%;right:27%}.tools{display:flex;justify-content:center;align-items:center;gap:8px;padding:0 20px 28px}.tool{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-size:12px;color:var(--muted)}.tool.primary{border-color:#b9d77e;color:#263316;background:#f0fbdc}
    .detail{border-left:1px solid var(--line);overflow:auto;padding:30px 34px 44px}.detail-top{display:flex;align-items:center;justify-content:space-between}.pager{display:flex;gap:8px}.pager button{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:20px}.category{margin-top:30px;color:#78a622;font-size:11px;font-weight:850;letter-spacing:.17em;text-transform:uppercase}.detail h1{font-size:clamp(38px,4.2vw,64px);line-height:.98;letter-spacing:-.055em;margin:15px 0 18px;max-width:330px}.drawing{width:76%;height:150px;object-fit:contain;margin:12px auto 24px;mix-blend-mode:multiply;filter:grayscale(1)}.label{font-size:9px;text-align:center;letter-spacing:.24em;color:#99a09c;border-bottom:1px solid var(--line);padding-bottom:18px}.lead{font-size:18px;line-height:1.45;margin:25px 0 12px;letter-spacing:-.02em}.bodycopy{font-size:14px;line-height:1.7;color:#59635e}.facts{margin-top:26px;border-top:1px solid var(--line)}.fact{display:grid;grid-template-columns:105px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-size:12px}.fact b{text-transform:uppercase;font-size:9px;letter-spacing:.14em;color:#849089}.story{margin-top:28px;background:var(--deep);color:#fff;padding:22px;border-radius:14px}.story .eyebrow{color:var(--acid)}.story h2{font-size:22px;margin:8px 0}.story p{font-size:13px;line-height:1.6;color:#bdc6c1;margin-bottom:0}
    .mobile-menu{display:none}.mobile-dots{display:none}
    @media(max-width:1050px){.topbar{grid-template-columns:250px 1fr}.search{display:none}.app{grid-template-columns:250px 1fr}.detail{grid-column:2;padding:40px 50px}.stage{min-height:620px}.catalog{grid-row:1 / span 2}.app{height:auto}.drawing{max-width:280px}.detail h1{max-width:600px}.bodycopy{max-width:720px}}
    @media(max-width:720px){.topbar{height:66px;grid-template-columns:1fr auto}.brand{border:0;padding:0 16px}.brand small{display:none}nav{display:none}.mobile-menu{display:block;margin-right:16px;border:1px solid var(--line);background:#fff;border-radius:8px;width:40px;height:40px}.app{display:block}.catalog{display:flex;overflow:auto;border:0;border-bottom:1px solid var(--line);padding:10px;gap:8px}.catalog-head,.catalog-foot{display:none}.item{flex:0 0 168px;height:66px;border:1px solid var(--line);grid-template-columns:48px 1fr}.number{display:none}.thumb{width:44px;height:44px}.stage{min-height:530px}.stage-head{padding:24px}.object-wrap{padding:0 24px}.object{max-width:78%;max-height:300px}.tools{padding-bottom:20px}.tool:nth-child(2){display:none}.detail{border:0;padding:34px 24px}.detail h1{font-size:46px}.drawing{height:130px}.orbit{right:20%}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="mark">io</div><div><strong>iotfyedu</strong><small>Teknolojiyle öğren</small></div></div>
    <nav><a class="active" href="#kesfet">Keşfet</a><a href="#hikaye">Zaman çizgisi</a><a href="#hakkinda">Hakkında</a></nav>
    <label class="search"><span>⌕</span><input id="search" aria-label="Buluşlarda ara" placeholder="Buluşlarda ara..."></label>
    <button class="mobile-menu" aria-label="Menü">☰</button>
  </header>
  <main class="app" id="kesfet">
    <aside class="catalog" aria-label="Buluşlar"><div class="catalog-head"><span class="eyebrow">Buluş arşivi</span><span class="count" id="result-count"></span></div><div id="items"></div><div class="catalog-foot">Geçmişin fikirlerinden geleceğin teknolojilerine uzanan seçili bir öğrenme koleksiyonu.</div></aside>
    <section class="stage" aria-label="Seçili nesne">
      <div class="stage-head"><div><div class="stage-date" id="stage-date"></div><div class="stage-place" id="stage-place"></div></div><span class="stage-badge">ETKİLEŞİMLİ ARŞİV</span></div>
      <div class="object-wrap"><div class="halo"></div><img class="object" id="object" alt=""><span class="orbit" aria-hidden="true"></span></div>
      <div class="tools"><button class="tool primary" id="rotate">↻ Döndür</button><button class="tool">◇ Detaylar</button><button class="tool" id="reset">⌖ Sıfırla</button></div>
    </section>
    <article class="detail" id="hikaye">
      <div class="detail-top"><span id="position">01 / 10</span><div class="pager"><button id="prev" aria-label="Önceki buluş">‹</button><button id="next" aria-label="Sonraki buluş">›</button></div></div>
      <div class="category" id="category"></div><h1 id="title"></h1><img class="drawing" id="drawing" alt=""><div class="label">BİÇİM &amp; İŞLEV / NESNE İNCELEMESİ</div>
      <p class="lead" id="lead"></p><p class="bodycopy" id="description"></p><div class="facts" id="facts"></div>
      <section class="story" id="hakkinda"><span class="eyebrow">GEÇMİŞTEN GELECEĞE</span><h2 id="story-title"></h2><p id="story-copy"></p></section>
    </article>
  </main>
  <script>
  const A='/assets/';
  const innovations=[
    {id:'wheel',name:'Ahşap Tekerlek',title:'Dünyayı Harekete Geçiren Fikir',date:'MÖ 3500 civarı',place:'Avrupa ve Batı Asya',cat:'Ulaşım',img:'tekerlek.webp',drawing:'tekerlek-cizim.webp',lead:'Basit bir form, sınırsız hareket.',desc:'Tekerlek ve dingil, yuvarlanmayı yük taşımak için kullanılabilir bir sisteme dönüştürdü. Ahşap işçiliğiyle mekanik düşüncenin birleşimi, kara ulaşımını kökten değiştirdi.',facts:[['Köken','Avrupa ve Batı Asya’da erken örnekler'],['Malzeme','Birleştirilmiş ahşap disk ve dingil'],['Temel fikir','Tekerlek ile dingilin birlikte dönmesi'],['Etkisi','Ağır yüklerin daha kolay taşınması']],story:'Yuvarlanan yüklerden akıllı ulaşıma',storyCopy:'Katı ahşap diskler zamanla telli, kauçuk ve kompozit tekerleklere dönüştü; temel mekanik ilke ise yaşamaya devam etti.'},
    {id:'boat',name:'Kamış Tekne',title:'Suyun Üzerinde Yeni Bir Yol',date:'MÖ 3500 civarı',place:'Nil Vadisi, Antik Mısır',cat:'Denizcilik',img:'tekne.webp',drawing:'tekne-cizim.webp',lead:'Hafif malzemeler, yeni bir hareket özgürlüğü.',desc:'Bağlanmış papirüs demetleri Nil üzerinde yolculuk, balıkçılık ve taşıma için hafif ve yüzebilir bir gövde oluşturdu.',facts:[['Köken','Nil Vadisi, Antik Mısır'],['Malzeme','Papirüs kamışları ve bitkisel bağlar'],['Temel fikir','Demetlerden oluşan yüzebilir gövde'],['Etkisi','Nehir ulaşımı ve bölgesel alışveriş']],story:'Akıntıyla başlayan yolculuk',storyCopy:'Kürek, yelken, buhar ve motor teknolojileri; insanlığın su üzerindeki menzilini kıtalara taşıdı.'},
    {id:'press',name:'Matbaa',title:'Bilginin Çoğalma Makinesi',date:'1450 civarı',place:'Mainz, Almanya',cat:'İletişim',img:'matbaa.webp',drawing:'matbaa.webp',lead:'Bir sayfadan binlerce zihne.',desc:'Hareketli metal harfler ve baskı presi, metinlerin hızlı, tutarlı ve daha düşük maliyetle çoğaltılmasını sağladı.',facts:[['Öncü','Johannes Gutenberg'],['Malzeme','Metal harfler, mürekkep ve kâğıt'],['Temel fikir','Yeniden kullanılabilir hareketli harfler'],['Etkisi','Bilginin geniş kitlelere yayılması']],story:'Baskıdan dijital yayına',storyCopy:'Mekanik çoğaltma, bugün anlık ve küresel dijital paylaşım olarak hayatımızı biçimlendiriyor.'},
    {id:'steam',name:'Buhar Makinesi',title:'Isıyı Harekete Dönüştürmek',date:'1712',place:'İngiltere',cat:'Enerji',img:'buhar.webp',drawing:'buhar.webp',lead:'Kas gücünün ötesinde sürekli güç.',desc:'Buhar basıncını mekanik harekete çeviren makineler; üretim, madencilik ve ulaşımın ölçeğini değiştirdi.',facts:[['Öncü','Thomas Newcomen'],['Enerji','Kömürle ısıtılan su buharı'],['Temel fikir','Basıncın pistonu hareket ettirmesi'],['Etkisi','Sanayi üretiminin hızlanması']],story:'Buhardan elektrifikasyona',storyCopy:'Kontrollü enerji dönüşümü fikri; türbinlerden modern enerji sistemlerine uzanan mühendislik zincirini başlattı.'},
    {id:'phone',name:'Telefon',title:'Uzağı Yakın Eden Ses',date:'1876',place:'Boston, ABD',cat:'İletişim',img:'telefon.webp',drawing:'telefon.webp',lead:'Ses, ilk kez kablolar boyunca yol aldı.',desc:'Ses dalgalarının elektrik sinyallerine dönüştürülmesi, insanların uzak mesafelerde eş zamanlı konuşmasını mümkün kıldı.',facts:[['Öncü','Alexander Graham Bell ve çağdaşları'],['Bileşen','Verici, alıcı ve iletim hattı'],['Temel fikir','Sesi elektrik sinyaline çevirmek'],['Etkisi','Anlık kişisel iletişim']],story:'Ahizeden akıllı cihaza',storyCopy:'Sabit hatla başlayan bağlantı, bugün cebimizdeki çok amaçlı ve küresel iletişim ağlarına dönüştü.'},
    {id:'flyer',name:'Wright Uçağı',title:'Gökyüzüne Kontrollü Adım',date:'1903',place:'Kitty Hawk, ABD',cat:'Havacılık',img:'ucak.webp',drawing:'ucak.webp',lead:'Havalanmak kadar yön vermek de önemliydi.',desc:'Motorlu uçuşu kanat bükme ve dümen kontrolüyle birleştiren Flyer, sürdürülebilir ve yönetilebilir uçuşun önünü açtı.',facts:[['Öncüler','Orville ve Wilbur Wright'],['Yapı','Ahşap, kumaş ve hafif motor'],['Temel fikir','Üç eksenli uçuş kontrolü'],['Etkisi','Modern havacılığın doğuşu']],story:'Birkaç saniyeden kıtalararası uçuşa',storyCopy:'Erken deneysel uçuşlar, güvenli jetlerden insansız hava araçlarına uzanan dev bir ekosisteme dönüştü.'},
    {id:'car',name:'Benz Motorwagen',title:'Bireysel Hareketin Motoru',date:'1886',place:'Mannheim, Almanya',cat:'Ulaşım',img:'otomobil.webp',drawing:'otomobil.webp',lead:'Yolculuk için kendi gücünü taşıyan araç.',desc:'İçten yanmalı motor, hafif şasi ve direksiyon düzenini tek bir sistemde buluşturan Motorwagen otomobil çağının simgelerinden biri oldu.',facts:[['Öncü','Karl Benz'],['Güç','Tek silindirli benzinli motor'],['Temel fikir','Motor ve şasinin bütünleşmesi'],['Etkisi','Kişisel ulaşımın yaygınlaşması']],story:'Motordan yazılıma',storyCopy:'Mekanik otomobil bugün elektrikli, bağlantılı ve giderek daha özerk bir mobilite platformuna dönüşüyor.'},
    {id:'radio',name:'Kablosuz Telgraf',title:'Havanın İçinden Gelen Mesaj',date:'1895–1901',place:'Avrupa ve Atlantik',cat:'Kablosuz iletişim',img:'telsiz.webp',drawing:'telsiz.webp',lead:'Mesajlar kablolardan kurtuldu.',desc:'Radyo dalgalarıyla kodlanmış sinyallerin gönderilip alınması, uzak mesafe iletişimini fiziksel hatlardan bağımsız hâle getirdi.',facts:[['Öncüler','Marconi ve dönemin araştırmacıları'],['Taşıyıcı','Elektromanyetik dalgalar'],['Temel fikir','Kablosuz sinyal iletimi'],['Etkisi','Radyo, yayıncılık ve mobil ağların temeli']],story:'Mors kodundan nesnelerin internetine',storyCopy:'Kablosuz veri fikri bugün sensörleri, evleri, şehirleri ve milyarlarca cihazı birbirine bağlıyor.'},
    {id:'tv',name:'Görüntü Ayrıştırıcı',title:'Hareketli Görüntünün Elektroniği',date:'1927',place:'San Francisco, ABD',cat:'Görüntü teknolojisi',img:'televizyon.webp',drawing:'televizyon.webp',lead:'Görüntü, satır satır elektriğe dönüştü.',desc:'Elektronik tarama ve görüntü ayrıştırma, hareketli görüntülerin uzaktan aktarılabildiği televizyon sistemlerinin gelişiminde önemli bir adımdı.',facts:[['Öncü','Philo Farnsworth'],['Bileşen','Elektronik kamera tüpü'],['Temel fikir','Görüntüyü elektronik satırlara ayırmak'],['Etkisi','Elektronik televizyonun gelişmesi']],story:'Tüpten piksele',storyCopy:'Analog ekranlar yerini yüksek çözünürlüklü, çevrimiçi ve etkileşimli görüntü deneyimlerine bıraktı.'},
    {id:'eniac',name:'ENIAC Bilgisayarı',title:'Hesabın Elektronik Çağı',date:'1946',place:'Philadelphia, ABD',cat:'Bilgi işlem',img:'bilgisayar.webp',drawing:'bilgisayar.webp',lead:'Oda büyüklüğündeki makineden cebimizdeki güce.',desc:'Binlerce vakum tüpüyle çalışan ENIAC, yüksek hızlı genel amaçlı elektronik hesaplamanın erken ve etkili örneklerinden biriydi.',facts:[['Geliştirenler','J. Presper Eckert ve John Mauchly'],['Yapı','Vakum tüpleri ve kablolu paneller'],['Temel fikir','Elektronik sayısal hesaplama'],['Etkisi','Modern bilgisayar çağının hızlanması']],story:'Vakum tüpünden yapay zekâya',storyCopy:'Elektronik hesaplama küçüldü, hızlandı ve ağlara bağlandı; bugün öğrenen sistemlerin temelini oluşturuyor.'}
  ];
  let current=0,rotation=0,query='';
  const $=s=>document.querySelector(s); const items=$('#items');
  function visible(){return innovations.map((x,i)=>({...x,i})).filter(x=>x.name.toLocaleLowerCase('tr').includes(query)||x.cat.toLocaleLowerCase('tr').includes(query))}
  function renderList(){const v=visible();$('#result-count').textContent=v.length+' nesne';items.innerHTML=v.map(x=>`<button class="item ${x.i===current?'active':''}" data-i="${x.i}"><img class="thumb" src="${A+x.img}" alt=""><span><span class="item-title">${x.name}</span><span class="item-date">${x.date}</span></span><span class="number">${String(x.i+1).padStart(2,'0')}</span></button>`).join('')||'<p style="padding:24px;color:#6b746f">Eşleşen buluş bulunamadı.</p>';items.querySelectorAll('button').forEach(b=>b.onclick=()=>select(+b.dataset.i))}
  function select(i){current=(i+innovations.length)%innovations.length;rotation=0;const x=innovations[current];location.hash=x.id;$('#stage-date').textContent=x.date.toUpperCase();$('#stage-place').textContent=x.place;$('#object').src=A+x.img;$('#object').alt=x.name;$('#object').style.transform='';$('#position').textContent=String(current+1).padStart(2,'0')+' / '+innovations.length;$('#category').textContent=x.cat;$('#title').textContent=x.title;$('#drawing').src=A+x.drawing;$('#drawing').alt=x.name+' çizimi';$('#lead').textContent=x.lead;$('#description').textContent=x.desc;$('#facts').innerHTML=x.facts.map(f=>`<div class="fact"><b>${f[0]}</b><span>${f[1]}</span></div>`).join('');$('#story-title').textContent=x.story;$('#story-copy').textContent=x.storyCopy;renderList()}
  $('#prev').onclick=()=>select(current-1);$('#next').onclick=()=>select(current+1);$('#rotate').onclick=()=>{rotation+=45;$('#object').style.transform=`rotate(${rotation}deg)`};$('#reset').onclick=()=>{rotation=0;$('#object').style.transform=''};$('#search').oninput=e=>{query=e.target.value.toLocaleLowerCase('tr').trim();renderList()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')select(current+1);if(e.key==='ArrowLeft')select(current-1)});const fromHash=innovations.findIndex(x=>x.id===location.hash.slice(1));select(fromHash<0?0:fromHash);
  </script>
</body>
</html>
